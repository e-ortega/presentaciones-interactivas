# Dependabot opens pull requests to update dependencies. Each one runs the same CI and
# goes through the same review as any other pull request.
#
# Minor and patch updates are grouped into one pull request per ecosystem and week, to keep
# the noise down. Major versions come one by one, because they can break things.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types must match the Node version the project runs on (24 LTS, D-69).
      # They move by hand, together with Node itself.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Node stays on an LTS version (D-69); moving to the next one is done by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
