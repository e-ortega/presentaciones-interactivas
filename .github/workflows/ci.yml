name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      # Warnings and analyzer findings fail the build (Directory.Build.props, .editorconfig).
      - run: dotnet build --no-restore --configuration Release
      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes
      # Integration tests start SQL Server with Testcontainers; the runner has Docker.
      - run: dotnet test --no-build --configuration Release

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      # schema.d.ts is generated from openapi.json, which a server test keeps equal to the real
      # API. If the two files drift apart, someone changed the contract and forgot the types.
      - name: Check the API types match the contract
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      # Type-aware lint; any warning fails (deprecated APIs, unhandled promises, accessibility).
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The ruleset on main requires this job by name: rename it there too if it changes here.
  image:
    name: Docker image
    runs-on: ubuntu-latest
    env:
      # Throwaway values for containers that only live during this job. Not secrets.
      MSSQL_SA_PASSWORD: Ci_Only_Passw0rd_1
      PI_SMOKE_URL: http://localhost:8080
      PI_SMOKE_KEY: ci-smoke-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build the image and start the app with SQL Server
        run: |
          export ADMIN_ACCESS_KEY_SHA256=$(printf '%s' "$PI_SMOKE_KEY" | sha256sum | cut -d' ' -f1)
          docker compose up --build --detach
          curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors "$PI_SMOKE_URL/health"
      # The only test of the real conversion: LibreOffice, pdftoppm and the fonts in the image.
      # -failSkips: a skipped smoke test here would mean nothing was checked.
      - name: Import a deck in the container
        run: dotnet run --project tests/Server.Tests -- -class "Server.Tests.Import.ContainerSmokeTests" -failSkips
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
