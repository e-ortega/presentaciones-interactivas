# Local environment: the app and SQL Server. Copy .env.example to .env first.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
    ports:
      - "14330:1433" # for SSMS; 14330 avoids clashing with a local SQL Server
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Server=db;Database=PresentacionesInteractivas;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Database__MigrateOnStartup: "true"
      AdminAccess__KeySha256: ${ADMIN_ACCESS_KEY_SHA256:-}
    ports:
      - "8080:8080"
    volumes:
      - app-data:/data

volumes:
  db-data:
  app-data:
